# Render Blueprint — free web service for the portfolio demo (supermercado.falvarez.dev).
# Setup: Render dashboard → New → Blueprint → select this repo → Apply.
# The Dockerfile handles everything else: vendor + Vite build, .env, key, migrate + seed on boot.
services:
  - type: web
    name: supermercado-ddd
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /up
