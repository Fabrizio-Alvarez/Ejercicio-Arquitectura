# Keeps the Render free instance from sleeping (free tier sleeps after 15 min idle).
# Public repo → Actions minutes are free; one 10s curl every 10 min ≈ negligible.
# ⚠️ GitHub disables scheduled workflows after 60 days of repo inactivity —
# if the demo starts sleeping, re-enable this workflow (one click on the
# Actions tab) or push any commit.
name: Keep demo awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo health endpoint
        run: |
          curl -fsS -m 90 --retry 2 https://supermercado-ddd.onrender.com/up \
            || curl -fsS -m 90 --retry 2 https://supermercado.falvarez.dev/up \
            || echo "::warning::demo unreachable"
